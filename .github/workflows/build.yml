name: test & build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # only used to attach ClipSend.exe to releases on v* tags

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libgl1 libfontconfig1 libdbus-1-3
      - run: pip install PySide6 requests cryptography websocket-client pytest
      - run: pytest -v tests/
        env:
          QT_QPA_PLATFORM: offscreen

  windows-exe:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install PySide6 requests cryptography websocket-client pyinstaller
      - name: Build ClipSend.exe
        run: >
          pyinstaller --noconfirm --onefile --windowed --name ClipSend --icon clipsend.ico
          --hidden-import PySide6.QtCore --hidden-import PySide6.QtGui
          --hidden-import PySide6.QtWidgets --hidden-import PySide6.QtNetwork
          --exclude-module PyQt5 --exclude-module PyQt6 --exclude-module tkinter
          clipsendx.py
      - name: Smoke test (start, quit, install, uninstall)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Resolve-Path dist\ClipSend.exe
          $log = "$env:LOCALAPPDATA\ClipSend\clipsend.log"
          function Run($file, $arg) {
            # not -Wait: that also waits for child processes (--install starts the installed copy)
            Write-Host "> $file $arg"
            $p = Start-Process $file -ArgumentList $arg -PassThru
            $null = $p.Handle                     # needed for ExitCode to be populated
            if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "$file $arg timed out" }
            if ($p.ExitCode -ne 0) { if (Test-Path $log) { Get-Content $log }; throw "$file $arg -> exit $($p.ExitCode)" }
          }
          # portable start (skip the install question), then quit via the control pipe
          New-Item -ItemType Directory -Force "$env:APPDATA\ClipSend" | Out-Null
          '{"offer_install": false}' | Set-Content "$env:APPDATA\ClipSend\config.json"
          Start-Process $exe
          Start-Sleep 15
          Run $exe '--quit'
          Write-Host 'portable start/quit OK'
          # per-user install: copies exe, autostart, Start Menu, Installed apps; starts it
          Run $exe '--install'
          Start-Sleep 15
          $inst = "$env:LOCALAPPDATA\Programs\ClipSend\ClipSend.exe"
          if (-not (Test-Path $inst)) { throw 'exe not installed' }
          $run = (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run').ClipSend
          if ($run -ne "`"$inst`"") { throw "autostart entry wrong: $run" }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\ClipSend.lnk")) { throw 'no shortcut' }
          if (-not (Test-Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\ClipSend')) { throw 'no uninstall entry' }
          Run $inst '--quit'
          Write-Host 'install + installed copy running OK'
          # uninstall from the installed exe itself (as "Installed apps" does)
          Run $inst '--uninstall'
          Start-Sleep 10
          if (Test-Path "$env:LOCALAPPDATA\Programs\ClipSend") { throw 'install dir not removed' }
          if ((Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run').ClipSend) { throw 'autostart not removed' }
          if (Test-Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\ClipSend') { throw 'uninstall entry not removed' }
          Write-Host 'uninstall OK'
          Get-Content $log
      - uses: actions/upload-artifact@v4
        with:
          name: ClipSend-windows
          path: dist/ClipSend.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} dist/ClipSend.exe --generate-notes
